name: Android — build & verify

# The Android half of the app is real code with its own manifest,
# resources and toolchain, and none of it is exercised by the iOS
# workflow. This job compiles it for real — a malformed manifest, a
# missing drawable or an icon that does not resolve fails here rather
# than on somebody's phone.
#
# It needs no secrets: the APK is signed with the debug key (see
# android/app/build.gradle.kts), which is enough to prove the build.
#
# The APK is uploaded as a run artifact, so a manual run doubles as the
# quickest way to get a real build onto a real device — no store, no
# review, no Apple secrets. Tick `tester_unlock` for a build that can
# play the whole bank without a purchase.
on:
  workflow_dispatch:
    inputs:
      tester_unlock:
        description: >-
          Tester build: adds Settings › Tester mode, which unlocks the
          full 1,100-question bank on the device without a purchase, and
          lifts the 50-draw limit. Sideload only — never for Play.
        type: boolean
        default: false
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "legal/**"
      - "store/**"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Regenerate localizations
        run: flutter gen-l10n

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Release gate
        run: dart run tool/pre_release_check.dart

      # Release, not debug: this is the configuration that runs the
      # resource pipeline over the manifest and every XML in res/, so a
      # broken adaptive icon or launch drawable is caught here.
      #
      # IQRAQUEST_TESTER compiles in the tester switch
      # (lib/app/build_flags.dart). On a pull request there is no input
      # at all, so the comparison is false and the PR gate keeps building
      # the store configuration, exactly as before.
      - name: Build the Android release APK
        run: |
          flutter build apk --release \
            --dart-define=IQRAQUEST_TESTER=${{ inputs.tester_unlock == true }}

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: iqraquest-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
