name: Web — school subdomain (offline)

# Le mode École est en réserve (lib/app/build_flags.dart,
# kClassroomEnabled). school.iqraquest.org ne doit plus rien servir :
# ce workflow publie une seule page, qui renvoie vers iqraquest.org, et
# garde le domaine personnalisé (CNAME) pour qu'aucune adresse ancienne
# ne tombe sur un 404 GitHub. Pour rouvrir : docs/SCHOOL_MODE_ARCHIVE.md.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/web-school-offline.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write the redirect page
        run: |
          mkdir -p site
          echo "school.iqraquest.org" > site/CNAME
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="utf-8">
            <meta name="robots" content="noindex">
            <meta http-equiv="refresh" content="0; url=https://iqraquest.org/">
            <title>IqraQuest</title>
          </head>
          <body>
            <p><a href="https://iqraquest.org/">iqraquest.org</a></p>
          </body>
          </html>
          HTML
          cp site/index.html site/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
