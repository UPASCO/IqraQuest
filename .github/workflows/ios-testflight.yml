name: iOS — build & upload to TestFlight

# Two jobs, one file:
#
#  - verify-build: runs on pull requests and needs NO secrets — it gates
#    the merge on analyze + tests + an unsigned iOS release build.
#  - build-and-upload: manual trigger only, on purpose. It uploads a
#    real build to App Store Connect and costs Apple/GitHub build
#    minutes, so it should never fire on every push. It checks all four
#    Apple secrets FIRST and fails with a clear message when one is
#    missing, instead of dying in a Ruby stack trace mid-lane.
on:
  workflow_dispatch:
    inputs:
      tester_unlock:
        description: >-
          Tester build: adds Settings › Tester mode, which unlocks the
          full 1,100-question bank on the device without a purchase. Leave
          OFF for anything headed to App Store review.
        type: boolean
        default: false
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "legal/**"
      - "store/**"

jobs:
  verify-build:
    # PR safety net: proves the iOS app still builds, without touching
    # signing or App Store Connect (secrets are not available — and not
    # needed — here).
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Regenerate localizations
        run: flutter gen-l10n

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build the iOS release (unsigned)
        run: flutter build ios --release --no-codesign

  build-and-upload:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check the Apple secrets are configured
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT APPLE_TEAM_ID; do
            eval "value=\${$name}"
            [ -z "$value" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secret(s):$missing"
            echo "::error::Add them under Settings → Secrets and variables → Actions."
            echo "::error::How to obtain each one: store/apple/TESTFLIGHT_SETUP.md"
            exit 1
          fi
          echo "All four Apple secrets are present."
          if [ -z "$IOS_DIST_CERT_P12" ]; then
            echo "::warning::IOS_DIST_CERT_P12 is not set — this build will"
            echo "::warning::ask Apple for a NEW distribution certificate and"
            echo "::warning::will fail once the team's limit is reached."
            echo "::warning::See store/apple/TESTFLIGHT_SETUP.md."
          fi

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Regenerate localizations
        run: flutter gen-l10n

      - name: Static analysis (release gate)
        run: flutter analyze

      - name: Run tests (release gate)
        run: flutter test

      - name: Build the Flutter iOS release (no codesign — fastlane signs)
        # --build-number must increase on every TestFlight upload for the
        # same version; the workflow run number is a simple, monotonic,
        # zero-extra-API-call source for that (see ios/fastlane/Fastfile).
        #
        # IQRAQUEST_TESTER compiles in the tester switch (lib/app/build_flags.dart).
        # It is a dart-define rather than a runtime setting on purpose: the
        # App Store binary is built without it and therefore cannot be
        # talked into handing out the Premium bank.
        run: |
          flutter build ios --release --no-codesign \
            --build-number=${{ github.run_number }} \
            --dart-define=IQRAQUEST_TESTER=${{ inputs.tester_unlock }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Build and upload to TestFlight
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # The team's one distribution identity, reused by every build.
          # Without it Xcode asks Apple for a new certificate on every
          # run and eventually hits the team's limit — see the lane.
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: bundle exec fastlane beta

      - name: Upload build artifacts (for debugging failed uploads)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            ios/build/**/*.log
            ~/Library/Logs/gym
          if-no-files-found: ignore
